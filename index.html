<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objectifs & Projets Family Sync</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Segoe UI;background:#0f172a;color:#fff;max-width:1300px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,select,button{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #475569}.ok{color:#22c55e}.bad{color:#ef4444}</style></head><body><h1>🎯 Objectifs & Projets Family Sync</h1><div class='card'><h2>Nouveau projet</h2><select id='ptype'><option>Voyage</option><option>Immobilier</option><option>Voiture</option><option>Travaux</option><option>Formation</option><option>Personnel</option></select><input id='title' placeholder='Nom du projet'><input id='target' type='number' placeholder='Objectif (€)'><input id='current' type='number' placeholder='Disponible (€)'><input id='saving' type='number' placeholder='Épargne mensuelle (€)'><input id='targetdate' type='date'><button onclick='addProject()'>Ajouter</button></div><div class='card'><h2>📊 Tableau de bord</h2><div id='dashboard'></div></div><div class='card'><div id='projects'></div></div><script src='app.js'></script></body></html>
