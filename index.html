<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objectifs & Projets de Vie</title><style>
body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;max-width:1100px;margin:auto;padding:20px}
.card{background:#1e293b;padding:15px;border-radius:14px;margin:12px 0}
input,select,button{padding:10px;margin:4px;border-radius:8px;border:none} button{background:#2563eb;color:#fff}
progress{width:100%;height:20px}.row{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<h1>🎯 Objectifs & Projets de Vie</h1>
<div class='card'>
<div class='row'>
<select id='type'><option>🏠 Immobilier</option><option>🚗 Voiture</option><option>✈️ Voyage</option><option>🔨 Travaux</option><option>🎓 Formation</option><option>⭐ Personnel</option></select>
<input id='nom' placeholder='Nom du projet'>
<input id='cible' type='number' placeholder='Budget cible (€)'>
<input id='actuel' type='number' placeholder='Déjà disponible (€)'>
<input id='mensuel' type='number' placeholder='Épargne mensuelle (€)'>
<button onclick='addProject()'>Ajouter</button></div></div>
<div class='card'><h3>📊 Tableau de bord</h3><div id='dashboard'></div></div>
<div id='projects'></div>
<script>
let db=JSON.parse(localStorage.lifeProjects||'[]');
function save(){localStorage.lifeProjects=JSON.stringify(db);render();}
function addProject(){if(!nom.value.trim())return;db.push({type:type.value,nom:nom.value,cible:+cible.value||0,actuel:+actuel.value||0,mensuel:+mensuel.value||0,tasks:[]});save();nom.value='';}
function addTask(i){let t=prompt('Nouvelle tâche');if(!t)return;db[i].tasks.push({txt:t,done:false});save();}
function toggleTask(i,j){db[i].tasks[j].done=!db[i].tasks[j].done;save();}
function delProject(i){db.splice(i,1);save();}
function render(){let total=0,saved=0;projects.innerHTML='';db.forEach((p,i)=>{total+=p.cible;saved+=p.actuel;let pct=p.cible?Math.min(100,p.actuel/p.cible*100):0;let reste=Math.max(0,p.cible-p.actuel);let mois=p.mensuel?Math.ceil(reste/p.mensuel):'∞';projects.innerHTML+=`<div class='card'><h3>${p.type} ${p.nom}</h3><progress value='${pct}' max='100'></progress><p>${pct.toFixed(1)}% | ${p.actuel}€ / ${p.cible}€</p><p>Reste : ${reste}€ | Estimation : ${mois} mois</p><button onclick='addTask(${i})'>Ajouter tâche</button><button onclick='delProject(${i})'>Supprimer</button><div>${p.tasks.map((t,j)=>`<div><input type=checkbox ${t.done?'checked':''} onchange='toggleTask(${i},${j})'> ${t.txt}</div>`).join('')}</div></div>`});dashboard.innerHTML=`Projets : ${db.length}<br>Objectifs cumulés : ${total.toFixed(0)} €<br>Déjà disponibles : ${saved.toFixed(0)} €<br>Reste global : ${(total-saved).toFixed(0)} €`;}
render();
</script></body></html>
